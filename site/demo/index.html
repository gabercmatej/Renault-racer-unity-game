<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <title>Renault Racer</title>

  <!--
    Phase 6 draft of the ShellRacer template (plan 6.5 / 17 / 20).

    This is the browser half of the mobile controls. Unity cannot fix any of it from
    inside the canvas: the gestures that ruin a touch racer - double-tap zoom, pinch,
    pull-to-refresh, the long-press callout, rubber-band overscroll - are cancelled by
    the page or not at all.

    Phase 11 adds the Shell/Renault branding, the loading bar and the unsupported-device
    card on top of this. The behaviour here is the part the phone test needs.
  -->

  <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0,
                 maximum-scale=1.0, minimum-scale=1.0,
                 user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111317">
  <meta name="format-detection" content="telephone=no">

  <style>
    :root { color-scheme: dark; }

    html, body {
      margin: 0; padding: 0;
      width: 100%;
      /* Three heights, deliberately, in increasing order of preference. 100% is the
         floor; 100dvh is the DYNAMIC viewport, which is the one that tracks Safari's
         URL bar sliding away instead of pretending it is not there; and JS overrides
         both from visualViewport once it runs. The CSS matters because it governs the
         FIRST paint - without dvh the loading screen is laid out against a viewport
         that includes the space under the toolbar, and the page starts life scrollable. */
      height: 100%;
      height: 100dvh;
      background: #111317;
      overflow: hidden;
      position: fixed; inset: 0;
      /* No pull-to-refresh and no rubber-band: both read as the game stuttering. */
      overscroll-behavior: none;
      /* Every gesture belongs to the game. Without this, a steer-drag scrolls the page
         and a quick double tap zooms, which makes the controls feel broken. */
      touch-action: none;
      -ms-touch-action: none;
      -webkit-user-select: none; user-select: none;
      /* iOS long-press callout on a canvas drag. */
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #unity-container {
      position: fixed; inset: 0;
      height: 100dvh;
      /* viewport-fit=cover lets the canvas reach the physical screen edge; Unity reads
         the cutouts back through Screen.safeArea, which SafeAreaFitter applies. */
    }

    #unity-canvas {
      display: block;
      width: 100%; height: 100%;
      background: #111317;
      touch-action: none;
      outline: none;
    }

    /* Loading screen (Phase 10), a lightweight CSS recreation of
       screen-loading-phase11-v1.png: charcoal, emblem, RENAULT white + RACER yellow,
       status, progress track, tagline, yellow corner stripes. No full-screen image: the
       only raster is the ~4 KB inline emblem (Tools/ArtPrep/prepare_ui.py
       --emblem-data-uri). The bar is driven ONLY by Unity's real onProgress callback.
       Text uses the system UI font on purpose - a web font here would be one more
       download in front of the game. Copy is the proposed copy from the Phase 10 brief,
       still subject to client sign-off. */
    #boot {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: min(2.4vh, 16px);
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      background: #111317; color: #ffffff;
      transition: opacity .35s ease; z-index: 10;
      overflow: hidden;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #bootEmblem { height: min(20vh, 120px); width: auto; display: block; }
    #bootTitle {
      margin: min(1.5vh, 10px) 0 0;
      font-weight: 800; letter-spacing: .02em; line-height: 1;
      font-size: clamp(26px, min(7vw, 9vh), 58px);
      white-space: nowrap;
    }
    #bootTitle span { color: #FFCC00; }
    #bootText {
      font-size: clamp(12px, min(2.2vw, 3.2vh), 18px); font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }
    #bar {
      width: min(56vw, 440px); height: 12px; box-sizing: border-box;
      border: 2px solid #AEB7C2; border-radius: 7px; padding: 2px;
      overflow: hidden;
    }
    #barFill {
      width: 0%; height: 100%; border-radius: 3px;
      background: #FFCC00; transition: width .15s linear;
    }
    #bootTagline {
      position: absolute; left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + min(6vh, 40px));
      text-align: center; font-size: clamp(11px, min(1.8vw, 2.8vh), 16px); opacity: .9;
    }
    .bootStripe {
      position: absolute; width: 34vmax; height: 10px; background: #FFCC00;
      box-shadow: 0 18px 0 #FFCC00; pointer-events: none;
    }
    .bootStripe.tl { top: 0; left: 0; transform: translate(-50%, 2vmax) rotate(-45deg); }
    .bootStripe.br { bottom: 0; right: 0; transform: translate(50%, -2vmax) rotate(-45deg); }

    #unsupported {
      position: fixed; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 8vw; text-align: center;
      background: #111317; color: #dbe6f2; z-index: 20;
    }
    #unsupported.show { display: flex; }

    /* Safe-area probe. env() is only readable from CSS, so we park the four insets on
       an off-screen element's padding and measure them back in JS. It is the only way
       to get a notch or a Dynamic Island across to Unity, which does not implement
       Screen.safeArea on WebGL at all. */
    #safeProbe {
      position: fixed; top: 0; left: 0;
      width: 0; height: 0; visibility: hidden; pointer-events: none;
      padding-top:    env(safe-area-inset-top, 0px);
      padding-right:  env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left:   env(safe-area-inset-left, 0px);
    }
  </style>
</head>
<body>
  <div id="safeProbe"></div>

  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="boot">
    <div class="bootStripe tl"></div>
    <div class="bootStripe br"></div>
    <img id="bootEmblem" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHAAAACSCAQAAAA3ZYZJAAAQzElEQVR42s1dZ8BUxRW9r6B8iKKAIk2xAyLGRrMQYwUrxI4oGoxRg0Y0JhgbzRiCRrGgkSgaNcSSREWDgiWIBsGAihHEgigoIILgJ23L8cd772N35szuvPLht/wQ3NndmTlTzr333PscSKYvR/k3RMQR0JaOFLXPOALJtEtOtt8mEBE/7LjU/VfEkwJp6Za0UN9rkAMUEXlQDpDvxA3RKwikKHm5SBaVDMcRyHbyqLSSjVKUokAgjohAmsgQecsw8GQvZPfHh+AksNezELhKy2GAVduUf7IcoAPBGwA2IV/2p4D9IfDK2rXASgA5pWUeOQBHl7VuMAP0IRgAIF+GRw7AI0qHfQhGh++przyAGeEkNKgBOhBsi0UACiXdLQLYgL3KFp0LwR5YF77Lh3h2OA0NaIA+BNdpqOQA/FHprAfBwwb8EE7QAmyVFYrZ4dccyxVUigC+RisNv4Pr3uWvHIDLssIwO/yGU/x+p3TUheCZCvhFGC7CNtlgmMXwXAh2wVoFlQKAz7BtWTc9CI5S9ilDMwfg2mwwzGKAHgQPUPyGKJ10IHhNO2n1xVoEsBrts7gRsxled62jBQAfoHEZfj4E/ejwliv/L5ie8Vnch9ks0Oe0bucBDCzDz4HAwVylZRFALQ7AAnLBbEKX9Bhmgd/R2jLLA3iTHEQXUCIwDoJL6DuPpscwiwviVa1zBQDHa/SsMT4kOH2DNhTb4HVw2iGmvx7O0E7FPIDnCL2+hh5EoyBoDEF/iuETP+QAHQi2wvsEFXXmXQjaaRdJEcBXaAmBCxeC6fQAOizdENPidxlF5X7levAhuK8iEfAgOJbu5VfSXfjp8NsOnxH8arGbRs86IUcuki/QrK77PgTP0tP4rDRXfjr8hlFUxlrR6xyAq0taehD0oLTtXfjJUUxz++2Mr8iuWoXWGj3rRonAx2iitfyrNhF5ABclxzDN/TeWonI9odf/pkvvQtJyb2wgU7EQNUkxTI7fPprRWgDwecmuiiaiL71I3oLAUTrtQ3A7nbZfJsUwOX72i+lNSgROJMe/A0F7fEMmbjG2S4Zh0uH10HZVhIqKyFl0eU6rO2d1DG+gGP4+GYZJL4ipFJWTNHrm4m1tgRYBHFrS0tEuH+bbyWG/JNQ7GX6n0F31ktJZH4LzKQH7e8nwmpJP/Zx+6vEtMcDA6JlF8TtGw28ragYVQiwC/8x0eGVDdCDwMI/Y/UCP+LQtyfU+iM4v815fQXfTX8JuehA8CuBnhNidQ3fu0/ExjI9fE2r05LF/2Y8H3utlpOV67AmBW+IJWKJ4bjb7yHXq/ZO4GMbHj6NyF0GB+9luL6HX/wKwHsBNhNydQPf5tLiXRVz8mlF6vUZxELkQtMcaQuTWoG0dfr0AFFEEsBbtlMXnQTCF7vT+8a6LuPiNpqgMJ/jdRVuODN8tJXCR20LFsCel3vMUV1ZmA3Qh2A3fElS+QIuynwyI3EbCR5ajOQQOPAiOqVsJgYOpk7K7oiNIn6RfxcEw3v13p5X32oNgIm15VdjSgeA/JQswB2CSMkAXgs7Uilys8N1MBhgw/XX053bQ6PUh1Dz6KFxcPgQnEvdhL4LhhKp2ZEYD9CC4l9LrC4jR8wK9xQZB4IcEbq5yVDHnhAvBnqglU7VU2RSpB+hC0FGz1PIAZpODiJtHs8OTOBjgbDoF/clhNdLoi/OzG6AHwUPaDxUAnEou3v/Szver61LkLNYnYa5Cvh0IWmIpuZisIxe2w+tFzaOXCT3j5tFM7Zx91sqe9CEYQjG8147T2F3vpphQb41eO9ruCv7Vp6ylB8F+yJPd9aliXTgQ+Br1Dj7V02aIdvgNrGr0mKMPkZ/b0/bqeIrMNQTDM+m3TsligIHRM89Ir8vxq8FH1MzprnUlC <script>
(function () {
  "use strict";

  var canvas    = document.querySelector("#unity-canvas");
  var boot      = document.querySelector("#boot");
  var barFill   = document.querySelector("#barFill");
  var container = document.querySelector("#unity-container");

  // --- Device pixel ratio cap ------------------------------------------------
  // The single biggest mobile lever (plan 20). A cheap phone at DPR 3 renders nine
  // times the pixels of DPR 1 onto a panel that cannot show the difference, and this
  // game is fill-rate bound, not geometry bound. Cap hard, and re-apply on resize -
  // a browser can change DPR when the window moves between displays or the user
  // changes zoom.
  var MAX_DPR = 2.0;          // QualityDirector lowers this per tier (plan 20).
  function dpr() { return Math.min(window.devicePixelRatio || 1, MAX_DPR); }

  // --- Safe area -------------------------------------------------------------
  // Read the env() insets off the probe and publish them for SafeArea.jslib. Measured
  // on every resize, because the insets change when the phone is rotated: on a
  // landscape iPhone the cutout is at the LEFT or the RIGHT depending on which way the
  // player turned it, and the home indicator moves with it.
  var safeProbe = document.querySelector("#safeProbe");
  window.__rrSafeInsets = { top: 0, right: 0, bottom: 0, left: 0, measured: false };

  function measureSafeArea() {
    try {
      var cs = getComputedStyle(safeProbe);
      var t = parseFloat(cs.paddingTop)    || 0;
      var r = parseFloat(cs.paddingRight)  || 0;
      var b = parseFloat(cs.paddingBottom) || 0;
      var l = parseFloat(cs.paddingLeft)   || 0;
      window.__rrSafeInsets = {
        top: t, right: r, bottom: b, left: l,
        // "measured" means the browser understood env() and we have a real answer -
        // including a real answer of zero on a phone with no cutout.
        measured: true
      };
    } catch (e) {
      window.__rrSafeInsets = { top: 0, right: 0, bottom: 0, left: 0, measured: false };
    }
  }
  measureSafeArea();

  function resize() {
    // Use the visual viewport where it exists: on iOS Safari the URL bar sliding away
    // changes the usable height without firing a normal resize, and innerHeight lies
    // during that transition. Getting this wrong is what leaves a strip of page
    // visible under the canvas, or puts the brake button off the bottom of the screen.
    var vv = window.visualViewport;
    var w = Math.round((vv ? vv.width  : window.innerWidth));
    var h = Math.round((vv ? vv.height : window.innerHeight));
    var r = dpr();

    container.style.width  = w + "px";
    container.style.height = h + "px";
    canvas.style.width  = w + "px";
    canvas.style.height = h + "px";
    canvas.width  = Math.round(w * r);
    canvas.height = Math.round(h * r);

    measureSafeArea();
  }

  // QualityDirector reaches this through SafeArea.jslib. It only ever tightens the
  // cap, never loosens it: a tier decision is a one-way ratchet (plan 20), and a page
  // that has already decided 1.0 is right for this device must not be talked back up.
  window.__rrSetMaxDpr = function (cap) {
    cap = Number(cap);
    if (!(cap > 0) || cap >= MAX_DPR) return;
    MAX_DPR = cap;
    resize();
  };

  // --- Fullscreen, best effort ----------------------------------------------
  // Asked for from inside the Ready tap (GameDirector.StartFromReady), because the
  // Fullscreen API is only granted inside a user gesture. What it can and cannot do:
  //
  //   Chrome / Android      grants it, and screen.orientation.lock() as well
  //   Safari / iPad         grants it
  //   Safari / iPhone       does NOT implement it for anything but <video>. Ever.
  //
  // So on the device this campaign most cares about, the toolbar stays. That is fine
  // and it is the design: resize() drives the canvas from the VISUAL viewport, so the
  // game fills whatever the browser leaves, and every control is placed inside the
  // safe-area insets measured from that. Fullscreen wins pixels; it is never what
  // makes the layout correct.
  window.__rrRequestFullscreen = function () {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!req) return false;
    try {
      var p = req.call(el, { navigationUI: "hide" });
      if (p && p.then) {
        p.then(function () {
          // Landscape lock is a separate permission and only exists once fullscreen
          // has been granted. Failing is normal; it must never reject unhandled.
          try {
            if (screen.orientation && screen.orientation.lock)
              screen.orientation.lock("landscape").catch(function () {});
          } catch (e) {}
          resize();
